<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Food Online</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #000; color: white; font-family: sans-serif; }
        .login-container { height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card-login { 
            background: #111; padding: 30px; border-radius: 15px; 
            border: 1px solid #ff0000; box-shadow: 0 0 20px #ff0000; width: 100%; max-width: 400px;
        }
        .neon-text { text-shadow: 0 0 10px #ff0000; color: #fff; text-align: center; font-weight: bold; }
        .btn-neon { background: #ff0000; color: white; border: none; width: 100%; padding: 10px; border-radius: 50px; font-weight: bold; }
        .btn-neon:hover { background: #cc0000; box-shadow: 0 0 15px #ff0000; }
        .form-control { background: #222; border: 1px solid #444; color: white; }
        .form-control:focus { background: #333; border-color: #ff0000; color: white; box-shadow: none; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card-login">
            <h2 class="neon-text mb-4">Acesso Parceiro</h2>
            <form action="/login" method="POST">
                <div class="mb-3">
                    <label>E-mail</label>
                    <input type="email" name="email" class="form-control" required placeholder="seu@email.com">
                </div>
                <div class="mb-4">
                    <label>Senha</label>
                    <input type="password" name="senha" class="form-control" required placeholder="******">
                </div>
                <button type="submit" class="btn-neon">ENTRAR NO SISTEMA</button>
            </form>
            <p class="text-center mt-3"><a href="/cadastro" style="color: #888; text-decoration: none;">Ainda não é parceiro? Cadastre-se</a></p>
        </div>
    </div>
</body>
</html>
