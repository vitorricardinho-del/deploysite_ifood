<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivinhema Food - Vitrine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* MUDANÇA: Fundo preto absoluto no corpo da página e texto branco */
        body { background-color: #000000; color: #ffffff; }
        
        /* MUDANÇA: Ajustado para um tom escuro premium para destacar o texto */
        .navbar-food { background-color: #111111; color: white; padding: 15px; text-align: center; font-weight: bold; border-bottom: 2px solid #EA1D2C; }
        
        /* MUDANÇA: Card agora é cinza escuro para casar com o fundo preto */
        .card-loja { 
            border: 1px solid #222222; 
            border-radius: 15px; 
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.05); 
            transition: 0.3s;
            background-color: #111111;
        }
        .card-loja:hover { transform: scale(1.02); border-color: #EA1D2C; }
        
        /* Estilo para a foto redonda do perfil */
        .foto-perfil {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #EA1D2C;
        }
        .btn-pedir { background-color: #EA1D2C; color: white; border-radius: 8px; font-weight: bold; border: none; padding: 10px; text-decoration: none; }
        .btn-pedir:hover { background-color: #c91825; color: white; }
        
        /* MUDANÇA: Ajustado o fundo da categoria para dar uma boa leitura no modo escuro */
        .badge-categoria { background-color: rgba(234, 29, 44, 0.15); color: #EA1D2C; border: 1px solid rgba(234, 29, 44, 0.3); border-radius: 5px; padding: 5px 10px; font-size: 0.8rem; }
        
        /* MUDANÇA: Força as linhas divisórias a ficarem mais suaves no escuro */
        hr { border-color: #333333; opacity: 1; }
        
        /* MUDANÇA: Deixa as descrições em um cinza claro legível */
        .text-muted { color: #aaaaaa !important; }
    </style>
</head>
<body>

    <div class="navbar-food shadow">
        <h2 class="m-0 text-uppercase" style="letter-spacing: 1px;">food On-line</h2>
        <small style="color: #EA1D2C; font-weight: bold;">Todas os lanche em um so Lugar</small>
    </div>

    <div class="container mt-4">
        <h4 class="mb-4 fw-bold">Lanchonetes em Ivinhema</h4>
        
        <div class="row">
            {% for loja in parceiros %}
            <div class="col-md-4 mb-4"> 
                <div class="card card-loja p-3 h-100">
                    <div class="d-flex align-items-center mb-3">
                        
                        <img src="{{ 'https://bedtrqqguxvmmjsgrswl.supabase.co/storage/v1/object/public/comida_online/perfis/' + loja['foto_perfil'] if loja['foto_perfil'] else 'https://via.placeholder.com/100?text=FOOD' }}" 
                            class="foto-perfil me-3 shadow-sm"
                            alt="{{ loja['nome'] }}"
                            onerror="this.src='https://via.placeholder.com/100?text=FOOD'">
                        
                        <div>
                            <h5 class="m-0 fw-bold text-white">{{ loja['nome'] }}</h5>
                            <span class="badge-categoria">{{ loja['categoria'] }}</span>
                        </div>
                    </div>

                    <p class="text-muted small">{{ loja['descricao'] }}</p>
                    <hr>
                    <div class="d-grid">
                        <a href="/cardapio/{{ loja['id'] }}" class="btn btn-pedir text-center">
                            📖 VER CARDÁPIO
                        </a>
                    </div>
                </div> 
            </div> 
            {% endfor %}
        </div>
    </div>

</body>
</html>
