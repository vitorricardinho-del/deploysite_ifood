<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Online - Ivinhema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            height: 100%; 
            font-family: 'Segoe UI', sans-serif; 
            background: radial-gradient(circle, #1a0000 0%, #000000 80%); 
            overflow: hidden; 
        }

        .tela-inteira {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 30px; /* Diminuí um pouco o padding do topo */
        }

        /* TOPO: Logo Neon Centralizada e com Efeito */
        .logo-neon { 
            text-align: center; 
            margin-top: 8vh; /* ISSO AQUI EMPURRA A LOGO MAIS PRO CENTRO */
        }
        
        .neon-title {
            color: #fff;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 3.2rem;
            margin-bottom: 0;
            /* Efeito de piscar a luz */
            animation: brilho-neon 1.5s ease-in-out infinite alternate;
        }

        .neon-subtitle {
            color: #ff0000;
            font-weight: bold;
            letter-spacing: 10px;
            text-transform: uppercase;
            font-size: 1rem;
            animation: brilho-neon-sub 1.5s ease-in-out infinite alternate;
        }

        /* Animações do Letreiro Neon */
        @keyframes brilho-neon {
            0% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 30px #ff0000; }
            100% { text-shadow: 0 0 15px #ff0000, 0 0 30px #ff0000, 0 0 50px #ff0000, 0 0 80px #ff0000; }
        }

        @keyframes brilho-neon-sub {
            0% { text-shadow: 0 0 5px #ff0000; }
            100% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000; }
        }

        /* CENTRO: Lanche + Botão juntos */
        .centro-lanche-botao {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            gap: 40px; 
        }

        .img-lanche {
            max-width: 90%;
            max-height: 40vh; 
            filter: drop-shadow(0 20px 20px rgba(0,0,0,0.9)); 
            animation: flutuar 3s ease-in-out infinite; 
        }

        @keyframes flutuar {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* BOTÃO ESTILIZADO */
        .btn-entrar {
            background-color: #ff0000;
            color: white;
            border: none;
            padding: 15px 60px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.3rem;
            text-decoration: none;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            transition: 0.3s;
            letter-spacing: 1px;
        }

        .btn-entrar:hover {
            background-color: #cc0000;
            box-shadow: 0 0 35px #ff0000;
            color: white;
            transform: scale(1.05);
        }

        /* BASE: Redes Sociais no rodapé */
        .social-footer { 
            display: flex; 
            gap: 40px; 
            margin-bottom: 10px;
        }
        
        .social-icon {
            color: #fff;
            font-size: 1.8rem;
            text-shadow: 0 0 10px #ff0000;
            transition: 0.3s;
            text-decoration: none;
        }

        .social-icon:hover { color: #ff0000; transform: scale(1.3); text-shadow: 0 0 20px #ff0000; }
    </style>
</head>
<body>

    <div class="tela-inteira">
        
        <!-- PARTE 1: LOGO NEON -->
        <div class="logo-neon">
            <h1 class="neon-title">Food Online</h1>
            <p class="neon-subtitle">Ivinhema</p>
        </div>

        <!-- PARTE 2: LANCHE E BOTÃO AGRUPADOS NO CENTRO -->
        <div class="centro-lanche-botao">
            <img src="{{ url_for('static', filename='lanche.png') }}" alt="Lanche" class="img-lanche">
            
            <a href="/vitrine" class="btn-entrar">
                Fazer Pedido
            </a>
        </div>

        <!-- PARTE 3: REDES SOCIAIS LÁ EMBAIXO -->
        <div class="social-footer">
            <a href="#" class="social-icon"><i class="fab fa-instagram"></i></a>
            <a href="#" class="social-icon"><i class="fab fa-whatsapp"></i></a>
            <a href="#" class="social-icon"><i class="fas fa-map-marker-alt"></i></a>
        </div>

    </div>

</body>
</html>
