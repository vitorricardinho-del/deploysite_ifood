<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seja Parceiro - Ivinhema Food</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* MUDANÇA: Fundo preto absoluto no corpo da página e texto branco */
        body { 
            background-color: #000000; 
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        
        /* MUDANÇA: Ajustado o header com fundo escuro e a borda inferior vermelha premium */
        .header-vermelho {
            background-color: #111111;
            color: white;
            padding: 40px 0;
            text-align: center;
            border-bottom: 3px solid #EA1D2C;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            margin-bottom: -50px;
        }

        /* MUDANÇA: Card agora é cinza escuro para casar com o tema escuro */
        .card-cadastro {
            background-color: #111111;
            border: 1px solid #222222;
            border-radius: 20px;
            box-shadow: 0px 10px 30px rgba(234, 29, 44, 0.05);
            padding: 30px;
        }

        .logo-food {
            font-weight: 900;
            font-size: 2.5rem;
            letter-spacing: -2px;
        }

        /* MUDANÇA: Labels brancos para dar contraste */
        .form-label {
            font-weight: 600;
            color: #ffffff;
        }

        /* MUDANÇA: Inputs em cinza grafite com textos brancos */
        .form-control, .form-select {
            background-color: #1a1a1a;
            border: 1px solid #333333;
            color: #ffffff;
            border-radius: 10px;
            padding: 12px;
        }

        /* MUDANÇA: Evita que o texto suma ao focar e adiciona borda vermelha iluminada */
        .form-control:focus, .form-select:focus {
            background-color: #222222;
            border-color: #EA1D2C;
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(234, 29, 44, 0.25);
        }

        .btn-entrar {
            background-color: #EA1D2C;
            border: none;
            color: white;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .btn-entrar:hover {
            background-color: #c91825;
            transform: translateY(-2px);
            color: white;
        }

        .texto-destaque {
            color: #EA1D2C;
            font-weight: bold;
        }

        /* MUDANÇA: Textos secundários em um tom cinza claro legível no fundo escuro */
        .text-muted, .form-text { 
            color: #aaaaaa !important; 
        }

        /* Estilo do Preview do Tema */
        .preview-tema {
            height: 10px;
            border-radius: 5px;
            margin-top: 8px;
            transition: 0.3s;
        }
    </style>
</head>
<body>

    <div class="header-vermelho shadow">
        <h1 class="logo-food text-uppercase">Ivinhema Food</h1>
        <p class="m-0" style="color: #EA1D2C; font-weight: bold;">Aumente suas vendas com o Robô do Delivery!</p>
    </div>

    <div class="container mb-5" style="margin-top: 80px;">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card-cadastro">
                    <h4 class="text-center mb-4 text-white">Cadastro de <span class="texto-destaque">Parceiro</span></h4>
                    
                    <form action="/cadastrar_parceiro" method="POST" enctype="multipart/form-data">
                        <div class="mb-3">
                            <label class="form-label">Nome da Lanchonete</label>
                            <input type="text" name="nome" class="form-control" placeholder="Ex: Burguer do João" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Cidade</label>
                            <select name="cidade" class="form-select" required>
                                <option value="" disabled selected style="color: #666;">Selecione a sua cidade...</option>
                                <option value="Ivinhema">Ivinhema</option>
                                <option value="Dourados">Dourados</option>
                                <option value="Naviraí">Naviraí</option>
                                <option value="Nova Andradina">Nova Andradina</option>
                                <option value="Angélica">Angélica</option>
                                <option value="Novo Horizonte">Novo Horizonte</option>
                                <option value="Deodápolis">Deodápolis</option>
                            </select>
                            <small class="text-muted">Selecione onde o seu estabelecimento está localizado.</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Foto do Perfil (JPG ou PNG)</label>
                            <input type="file" name="foto_perfil" class="form-control" accept="image/*">
                            <small class="text-muted">Selecione a logomarca do seu estabelecimento.</small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">WhatsApp (para pedidos)</label>
                            <input type="tel" name="whatsapp" class="form-control" placeholder="67 99999-9999" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Categoria</label>
                            <select name="categoria" class="form-select" required>
                                <option value="Lanches">Lanches / Hambúrguer</option>
                                <option value="Pizza">Pizzaria</option>
                                <option value="Japonesa">Comida Japonesa</option>
                                <option value="Doces">Doces e Bolos</option>
                                <option value="Bebidas">Distribuidora de Bebidas</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Estilo Visual (Tema do Cardápio)</label>
                            <select name="cor_tema" class="form-select" id="cor_tema" onchange="atualizarPreview(this)" required>
                                <option value="#EA1D2C">🔴 Danger Neon (Vermelho) - Hamburguerias</option>
                                <option value="#28a745">🟢 Deep Forest (Verde) - Pizzarias</option>
                                <option value="#ffc107">🟡 Golden Night (Amarelo) - Docerias</option>
                                <option value="#007bff">🔵 Ocean Blue (Azul) - Sorveterias</option>
                                <option value="#fd7e14">🟠 Dark Orange (Laranja) - Pastelarias</option>
                            </select>
                            <div id="preview-cor" class="preview-tema" style="background-color: #EA1D2C;"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descrição curta</label>
                            <textarea name="descricao" class="form-control" rows="3" placeholder="Fale um pouco sobre o que vocês fazem de melhor..."></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">E-mail de Acesso</label>
                            <input type="email" name="email" class="form-control" placeholder="exemplo@email.com" required>
                            <div class="form-text">Este será seu login no sistema.</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Senha (mínimo 8 dígitos)</label>
                            <input type="password" name="senha" class="form-control" 
                                placeholder="Crie uma senha segura" 
                                minlength="8" required>
                            <div class="form-text">Sua senha deve ter pelo menos 8 caracteres.</div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-entrar">CADASTRAR MEU NEGÓCIO</button>
                        </div>
                    </form>
                </div>
                <div class="text-center mt-3">
                    <a href="/vitrine" class="text-muted text-decoration-none small" style="transition: 0.3s;" onmouseover="this.style.color='#EA1D2C'" onmouseout="this.style.color='#aaaaaa'">Ir para a Vitrine</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function atualizarPreview(select) {
            document.getElementById('preview-cor').style.backgroundColor = select.value;
        }
    </script>

</body>
</html>
